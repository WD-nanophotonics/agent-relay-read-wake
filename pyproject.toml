[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-courier"
version = "1.0.0"
description = "A reusable Gmail attachment transport for agent workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.0,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "playwright>=1.48",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gmail-courier = "gmail_courier.cli:main"
agent-relay = "agent_relay.cli:main"

[tool.setuptools.packages.find]
include = ["gmail_courier*", "agent_relay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-courier"
version = "2.0.0"
description = "A bounded Python ChatGPT request/response transport for local agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.48"]

[project.scripts]
chat-courier = "chat_courier.cli:main"

[tool.setuptools.packages.find]
include = ["chat_courier*"]
